<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Poikilia</title>
    <meta name="description" content="Rezepte, Kochmodus und Einkaufsliste – offline, Daten bleiben im Browser.">
    <meta name="theme-color" content="#FFF6E5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Poikilia">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: #FFF6E5; }
        #app { position: fixed; inset: 0; }
        /* Hinweis auf eine neue Version: liegt über dem Compose-Canvas, bis der Nutzer neu lädt. */
        #update {
            position: fixed; left: 16px; right: 16px; bottom: 92px; z-index: 10; display: none;
            max-width: 520px; margin: 0 auto; padding: 12px 14px; box-sizing: border-box;
            align-items: center; gap: 12px;
            background: #FFCB47; color: #141414; border: 2.5px solid #141414; border-radius: 14px;
            box-shadow: 4px 4px 0 #141414; font: 500 15px/1.35 system-ui, sans-serif;
        }
        #update.visible { display: flex; }
        #update span { flex: 1; }
        #update button {
            font: 700 15px system-ui, sans-serif; color: #141414; background: #FFFFFF; cursor: pointer;
            border: 2.5px solid #141414; border-radius: 10px; padding: 8px 12px;
        }
    </style>
    <script type="application/javascript" src="webApp.js" defer></script>
</head>
<body>
<div id="app"></div>
<div id="update" role="status">
    <span>Neue Version ist bereit.</span>
    <button type="button" id="update-reload">Neu laden</button>
</div>
<script>
    // Service Worker gibt es nur im PWA-Build (:webApp:pwaDistribution). Im Dev-Server fehlt sw.js → nichts passiert.
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then((registration) => {
                const banner = document.getElementById('update');
                const offer = (worker) => {
                    banner.classList.add('visible');
                    document.getElementById('update-reload').onclick = () => worker.postMessage('SKIP_WAITING');
                };
                // Nur anbieten, wenn schon eine Version läuft – beim allerersten Besuch ist nichts zu aktualisieren.
                if (registration.waiting && navigator.serviceWorker.controller) offer(registration.waiting);
                registration.addEventListener('updatefound', () => {
                    const worker = registration.installing;
                    worker && worker.addEventListener('statechange', () => {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) offer(worker);
                    });
                });
                let reloading = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloading || !banner.classList.contains('visible')) return;
                    reloading = true;
                    window.location.reload();
                });
            }).catch(() => { /* kein PWA-Build oder nicht erlaubt (http): App läuft trotzdem, nur ohne Offline-Cache */ });
        });
    }
</script>
</body>
</html>
